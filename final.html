<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <title>EduMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body, html {
        height: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #003b46;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #003b46;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      /* Spinner styles */
      .spinner {
        border: 8px solid #f3f3f3;
        border-top: 8px solid #840944;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #chat-container {
        width: 100%;
        height: 100%;
        display: none; /* Hide the chat container initially */
      }

      #custom-chat-iframe {
        background-color: #ffffff;
        border: 2px solid #2563eb;
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
      }

      .bpw-from-user .bpw-chat-bubble .bpw-chat-bubble-content .bpw-new-messages-indicator {
        background-color: #ff00dd;
      }
    </style>
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="spinner"></div>
    </div>

    <!-- Chat Container -->
    <div id="chat-container"></div>

    <script src="https://cdn.botpress.cloud/webchat/v0/inject.js"></script>
    <script>
      // Show loading screen, then initialize chatbot
      function initializeChatbot() {

        window.botpressWebChat.init({
          botId: "3071f167-938c-48c9-a328-de32d67440de",
          clientId: "3071f167-938c-48c9-a328-de32d67440de",
          hostUrl: "https://cdn.botpress.cloud/webchat/v0",
          messagingUrl: "https://messaging.botpress.cloud",
          botName: "EduMate",

          // Add the avatar URL here
          avatarUrl: "https://i.pinimg.com/originals/0c/67/5a/0c675a8e1061478d2b7b21b330093444.gif", 
          stylesheet: "https://webchat-styler-css.botpress.app/prod/code/80f25747-dda5-4efb-9c4f-7bc71749c564/v57359/style.css",
          //"https://webchat-styler-css.botpress.app/prod/code/b418af80-230a-4be0-8c33-bbb9dc4af279/v26072/style.css",// Example chatbot avatar URL

          showBotInfoPage: true,
          containerWidth: "100%25",
          layoutWidth: "100%25",
          
          enableConversationDeletion: true,
          hideWidget: true,
          disableAnimations: true,
        });

        // Opens up the Chatbot by default
        window.botpressWebChat.onEvent(
          function () {
            // Show the chatbot and hide the loading screen
            document.getElementById("loading-screen").style.display = "none";
            document.getElementById("chat-container").style.display = "block";
            window.botpressWebChat.sendEvent({ type: "show" });
          },
          ["LIFECYCLE.LOADED"]
        );
      }

      // Simulate a delay to show the loading screen
      window.addEventListener("load", function () {
        setTimeout(initializeChatbot, 500); // Adjust delay as needed
      });
    </script>
  </body>
</html>
