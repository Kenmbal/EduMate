<!DOCTYPE html>
<html>
  <head>
    <title>EduMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body, html {
        height: 100%;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ffffff;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      /* Spinner styles */
      .spinner {
        border: 8px solid #f3f3f3;
        border-top: 8px solid #2563eb;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #chat-container {
        width: 100%;
        height: 100%;
        display: none; /* Hide the chat container initially */
      }

      #custom-chat-iframe {
        background-color: #ffffff;
        border: 2px solid #2563eb;
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
      }

      .bpw-from-user .bpw-chat-bubble .bpw-chat-bubble-content .bpw-new-messages-indicator {
        background-color: #ff00dd;
      }
    </style>
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="spinner"></div>
    </div>

    <!-- Chat Container -->
    <div id="chat-container"></div>

    <script src="https://cdn.botpress.cloud/webchat/v0/inject.js"></script>
    <script>
      // Show loading screen, then initialize chatbot
      function initializeChatbot() {

        window.botpressWebChat.init({
          botId: "3071f167-938c-48c9-a328-de32d67440de",
          clientId: "3071f167-938c-48c9-a328-de32d67440de",
          hostUrl: "https://cdn.botpress.cloud/webchat/v0",
          messagingUrl: "https://messaging.botpress.cloud",
          botName: "EduMate",

          // Add the avatar URL here
          avatarUrl: "https://scontent.xx.fbcdn.net/v/t1.15752-9/462638091_556790207323689_4635697836386795126_n.jpg?stp=dst-jpg_s480x480_tt6&_nc_cat=106&ccb=1-7&_nc_sid=0024fc&_nc_eui2=AeEnHVqhKRSUGqZoBNytiNYM8oZnEH7LcXvyhmcQfstxe2rf-3bJm8veKUWiGw8gBiZ-4jXM3lQP-YXmBKDOkOZp&_nc_ohc=tbyAs8e7NYwQ7kNvgHkr3k_&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.xx&oh=03_Q7cD1QEZIhRlS74ReVFd4z1lvrYHcUX-TqqSp40EGVgZreOGTw&oe=6780C07B", 
          stylesheet: "https://webchat-styler-css.botpress.app/prod/code/b418af80-230a-4be0-8c33-bbb9dc4af279/v26072/style.css",// Example chatbot avatar URL

          showBotInfoPage: true,
          containerWidth: "100%25",
          layoutWidth: "100%25",
          
          enableConversationDeletion: true,
          hideWidget: true,
          disableAnimations: true,
        });

        // Opens up the Chatbot by default
        window.botpressWebChat.onEvent(
          function () {
            // Show the chatbot and hide the loading screen
            document.getElementById("loading-screen").style.display = "none";
            document.getElementById("chat-container").style.display = "block";
            window.botpressWebChat.sendEvent({ type: "show" });
          },
          ["LIFECYCLE.LOADED"]
        );
      }

      // Simulate a delay to show the loading screen
      window.addEventListener("load", function () {
        setTimeout(initializeChatbot, 1000); // Adjust delay as needed
      });
    </script>
  </body>
</html>
